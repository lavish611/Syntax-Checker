<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart JavaScript Syntax Checker</title>
  <style>
    body {
      background-color: #0d1117;
      color: #00eaff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 30px;
    }
    textarea {
      width: 80%;
      height: 250px;
      background: #161b22;
      color: #00ffcc;
      font-size: 16px;
      border: 2px solid #00bfff;
      border-radius: 8px;
      padding: 10px;
      resize: none;
      outline: none;
    }
    button {
      margin-top: 20px;
      background-color: #00bfff;
      border: none;
      color: black;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>💡 Smart JavaScript Syntax Checker</h2>
  <textarea id="code" placeholder="Type your JavaScript code here..."></textarea><br>
  <button onclick="checkCode()">Check Code</button>
  <div id="result"></div>

  <script>
    function checkCode() {
      const code = document.getElementById("code").value;
      const result = document.getElementById("result");
      result.innerHTML = "";

      if (code.trim() === "") {
        result.style.color = "#ff5555";
        result.textContent = "⚠ Please enter some code!";
        return;
      }

      try {
        // Step 1: Check syntax (compile only)
        new Function(code);

        // Step 2: Try running to catch runtime errors
        try {
          eval(code);
          result.style.color = "#00ff00";
          result.textContent = "✅ No syntax or runtime errors found!";
        } catch (runtimeError) {
          result.style.color = "#ffcc00";
          result.textContent = "⚠ Runtime Error:\n" + runtimeError.message;
        }

      } catch (syntaxError) {
        result.style.color = "#ff5555";
        result.textContent = "❌ Syntax Error:\n" + syntaxError.message;
      }
    }
  </script>
</body>
</html>
